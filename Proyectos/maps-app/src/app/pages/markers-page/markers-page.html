<div #map class="w-screen h-[calc(100vh-64px)]"></div>

<section class="fixed w-56 bg-white rounded top-20 left-10 p-5">
  <h2 class="text-xl font-bold text-black mb-2">Marcadores</h2>

  <div class="flex flex-col gap-2 flex-wrap">
    @for (marker of markers(); track marker.id){
      <div class="form-control" (click)="flyToMarkers(marker.maplibreMarker.getLngLat())">
        <label class="label cursor-pointer">
          <span class="label-text text-gray-800 text-xs" title="Lng: {{ marker.markerCoordinates.lng }}, Lat: {{ marker.markerCoordinates.lat }}">
            Lng: {{ marker.markerCoordinates.lng | number:'1.5-5' }}, Lat: {{ marker.markerCoordinates.lat | number:'1.5-5' }}
          </span>
          <input type="radio" name="radio-4" [style]="{backgroundColor: marker.maplibreMarker._color}" class="radio" checked="checked" />
        </label>
      </div>
    } @empty {
      <div class="flex justify-center items-center bg-blue-100 rounded-2xl p-5">
        <p class="text-sm text-secondary">
          No hay marcadores
        </p>
      </div>
    }
  </div>
</section>
