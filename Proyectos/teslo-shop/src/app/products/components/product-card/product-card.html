
  <div class="card bg-base-100 w-96 shadow-sm">
    <figure>
      <img
        [src]="product().images | productImage"
        [alt]="product().title" />
    </figure>
    <div class="card-body">
      <h2 class="card-title font-montserrat text-accent text-lg" [routerLink]="['/product', product().slug.toLowerCase()]">
        {{product().title}}
      </h2>
      <p>
        {{product().description.slice(0,70)}}
      </p>
      <div class="card-actions justify-end">
        <a class="text-xs text-accent" [routerLink]="['/product', product().slug.toLowerCase()]">Ver Más</a>
      </div>
    </div>
  </div>
