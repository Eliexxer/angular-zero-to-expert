<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
  <product-carousel [images]="product().images"></product-carousel>
  <div>
    <h2 class="text-2xl font-bold font-montserrat">
      {{product().title}}
    </h2>

    <div class="divider"></div>

    <p>
      {{product().description}}
    </p>
  </div>
</div>
